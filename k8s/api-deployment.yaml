apiVersion: apps/v1
kind: Deployment
metadata:
  name: lactenovo-api
  namespace: lactenovo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lactenovo-api
  template:
    metadata:
      labels:
        app: lactenovo-api
    spec:
      containers:
        - name: api
          image: ghcr.io/miguelea44/lactenovo-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
